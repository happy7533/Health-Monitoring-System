services:
  - type: web
    name: safety-wearable-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/dashboard/summary
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: safety-wearable-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: safety-wearable-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: safety-wearable-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: safety-wearable-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: safety-wearable-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false

databases:
  - name: safety-wearable-db
    databaseName: safety_wearable_db
    user: safety_wearable
    plan: free
    region: oregon