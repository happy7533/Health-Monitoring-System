services:
  - type: web
    name: safety-wearable-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: >-
      sh -c 'SPRING_DATASOURCE_URL="jdbc:$DATABASE_URL" exec java -jar /app/app.jar'
    healthCheckPath: /api/dashboard/summary
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safety-wearable-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false

databases:
  - name: safety-wearable-db
    databaseName: safety_wearable_db
    user: safety_wearable
    plan: free
    region: oregon